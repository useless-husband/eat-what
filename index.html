<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天吃什麼？</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <h1>🍜 今天吃什麼？</h1>
  <p class="subtitle">選擇困難救星，轉一下就知道</p>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel" width="360" height="360"></canvas>
  </div>

  <button id="spin" class="spin-btn">轉！</button>
  <p id="result" class="result"></p>

  <section class="editor">
    <h2>選項清單</h2>
    <div class="add-row">
      <input id="newItem" type="text" placeholder="新增一個選項，例如：滷肉飯" maxlength="12">
      <button id="add">新增</button>
    </div>
    <ul id="list"></ul>
    <button id="reset" class="link-btn">還原預設清單</button>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
